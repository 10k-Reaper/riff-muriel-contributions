name: iOS build

# Builds an unsigned Muriel.ipa on a GitHub macOS runner and publishes it to the rolling
# "ios-latest" release. Sideload it with Sideloadly or AltStore/SideStore, which sign it with your Apple ID.
on:
  push:
    branches: [muriel, main]
    paths-ignore: ['**.md', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1' # desktop-only dev dependency, not needed here
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the web bundle
        run: node mobile/build.mjs

      - name: Sync into the Xcode project
        run: npx cap sync ios

      - name: Compile (unsigned)
        run: |
          xcodebuild -quiet \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$(node -p "require('./package.json').version")" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            build

      - name: Package Muriel.ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry Muriel.ipa Payload
          ls -lh Muriel.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Muriel-ipa
          path: Muriel.ipa

      - name: Publish to the ios-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ios-latest --cleanup-tag --yes 2>/dev/null || true
          gh release create ios-latest Muriel.ipa \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Muriel for iPhone (latest build)" \
            --notes "Unsigned build of ${GITHUB_SHA::7} (run ${{ github.run_number }}). Install with Sideloadly or AltStore/SideStore using your Apple ID. Free Apple IDs need re-signing every 7 days."
