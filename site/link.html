<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Link to Muriel</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="icon.png">
  <style>
    :root { --bg: #f4f1ec; --ink: #17141a; --muted: #6b6470; --card: #ffffff; --line: rgba(23, 20, 26, .1); --accent: #e0245e; --accent-ink: #fff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f0d12; --ink: #f3eff5; --muted: #a59eab; --card: #1a171e; --line: rgba(243, 239, 245, .1); --accent: #ff4f8b; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink); font: 16px/1.5 Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; }
    main { width: 100%; max-width: 420px; padding: 28px 24px; border-radius: 24px; background: var(--card); border: 1px solid var(--line); text-align: center; }
    img { width: 64px; height: 64px; border-radius: 16px; }
    h1 { margin: 14px 0 6px; font-size: 22px; }
    p { margin: 0 0 18px; color: var(--muted); }
    .code { margin: 6px 0 20px; font: 700 32px/1 ui-monospace, 'SF Mono', Menlo, Consolas, monospace; letter-spacing: .08em; user-select: all; }
    a.btn { display: inline-block; padding: 13px 24px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 700; text-decoration: none; }
    .small { margin: 18px 0 0; font-size: 13.5px; }
    .small a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <img src="icon.png" alt="">
    <h1>Link to Muriel</h1>
    <p id="lead">Opening Muriel…</p>
    <div class="code" id="code"></div>
    <a class="btn" id="open" href="#">Open Muriel</a>
    <p class="small">If Muriel doesn't open: in Muriel go to <b>Settings → Sync → Enter a code</b> and type the code above. It works for 5 minutes.</p>
    <p class="small">No Muriel yet? <a href="./">Get it here</a>.</p>
  </main>
  <script>
    // the code comes after the # so it never reaches a server
    var raw = (location.hash.slice(1) || new URLSearchParams(location.search).get('c') || '').toUpperCase().replace(/[^0-9A-Z]/g, '').slice(0, 8);
    var codeEl = document.getElementById('code'), open = document.getElementById('open');
    if (raw.length === 8) {
      codeEl.textContent = raw.slice(0, 4) + '-' + raw.slice(4);
      open.href = 'muriel://link?code=' + raw;
      setTimeout(function () { location.href = open.href; }, 300);
    } else {
      document.getElementById('lead').textContent = 'This link has no code. Show a new one in Muriel: Settings → Sync → Link a device.';
      open.style.display = 'none';
    }
  </script>
</body>
</html>
