name: Android build

# Builds a signed Muriel.apk and publishes it to the rolling "android-latest" release.
# Signed with the same release key every time (GitHub secrets), so new builds install as updates.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE', 'site/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the web bundle
        run: node mobile/build.mjs

      - name: Sync into the Android project
        run: npx cap sync android

      - name: Build signed APK
        env:
          MURIEL_KEYSTORE_B64: ${{ secrets.MURIEL_KEYSTORE_B64 }}
          MURIEL_KEYSTORE_PASSWORD: ${{ secrets.MURIEL_KEYSTORE_PASSWORD }}
          MURIEL_KEY_PASSWORD: ${{ secrets.MURIEL_KEYSTORE_PASSWORD }}
          MURIEL_KEY_ALIAS: muriel
          MURIEL_VERSION_CODE: ${{ github.run_number }}
        run: |
          echo "$MURIEL_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/muriel-release.p12"
          export MURIEL_KEYSTORE="$RUNNER_TEMP/muriel-release.p12"
          export MURIEL_VERSION_NAME="$(node -p "require('./package.json').version")"
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../Muriel.apk
          ls -lh ../Muriel.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Muriel-apk
          path: Muriel.apk

      - name: Publish to the android-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # only the newest commit on main replaces the public build (a re-run of an older run would
          # otherwise put an older build back, which Android refuses to install over the newer one)
          head="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$head" != "$GITHUB_SHA" ]; then echo "main is at ${head::7} now; not publishing ${GITHUB_SHA::7}"; exit 0; fi
          # downloads so far, kept across builds (GitHub resets the count when the file is replaced; the
          # website adds this to the new file's count). 3530 = downloads counted before this existed
          # 3530:3994: the first carrying build dropped the replaced file's own downloads (464 when last counted)
          before="$(bash .github/carry-downloads.sh android-latest Muriel.apk 3530 3530:3994)"
          gh release delete android-latest --cleanup-tag --yes 2>/dev/null || true
          gh release create android-latest Muriel.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Muriel for Android (latest build)" \
            --notes "Build of ${GITHUB_SHA::7} (run ${{ github.run_number }}). Download Muriel.apk on your phone and open it to install. Allow installs from your browser/files app if Android asks.<!-- muriel-downloads-before: $before -->"
